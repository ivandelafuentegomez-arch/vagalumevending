<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vending Vagalume</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function VendingManager() {
            const [machines, setMachines] = useState([]);
            const [currentView, setCurrentView] = useState('machines');
            const [selectedMachine, setSelectedMachine] = useState(null);
            const [showAddMachine, setShowAddMachine] = useState(false);
            const [showAddProduct, setShowAddProduct] = useState(false);
            const [showCashModal, setShowCashModal] = useState(false);
            const [showCoffeeSalesModal, setShowCoffeeSalesModal] = useState(false);
            const [showEmailModal, setShowEmailModal] = useState(false);
            const [showVisitModal, setShowVisitModal] = useState(false);
            const [activeTab, setActiveTab] = useState('restock');

            useEffect(() => {
                const saved = localStorage.getItem('vending-machines');
                if (saved) {
                    const loadedMachines = JSON.parse(saved);
                    const migratedMachines = loadedMachines.map(machine => {
                        if (machine.type === 'vending') {
                            return {
                                ...machine,
                                products: machine.products.map(product => {
                                    if (product.batches) return product;
                                    return {
                                        ...product,
                                        batches: [{
                                            id: Date.now().toString() + Math.random(),
                                            quantity: product.quantity || 0,
                                            expiryDate: product.expiryDate || '',
                                            cost: product.cost || 0
                                        }],
                                        quantity: product.quantity || 0,
                                        expiryDate: product.expiryDate || '',
                                        cost: product.cost || 0
                                    };
                                })
                            };
                        }
                        return machine;
                    });
                    setMachines(migratedMachines);
                    localStorage.setItem('vending-machines', JSON.stringify(migratedMachines));
                }
            }, []);

            const saveData = (updatedMachines) => {
                localStorage.setItem('vending-machines', JSON.stringify(updatedMachines));
                setMachines(updatedMachines);
            };

            const addMachine = (name, location, type) => {
                const newMachine = {
                    id: Date.now().toString(),
                    name,
                    location,
                    type: type || 'vending',
                    cash: 0,
                    products: [],
                    sales: [],
                    expired: [],
                    cashMovements: [],
                    visits: [],
                    coffeePrices: type === 'coffee' ? {
                        normal: 0.70,
                        descafeinado: 0.70,
                        conLeche: 0.70,
                        cortado: 0.70,
                        chocolate: 0.70
                        Té: 0.70
                    } : null
                };
                saveData([...machines, newMachine]);
                setShowAddMachine(false);
            };

            const deleteMachine = (id) => {
                if (confirm('¿Eliminar esta máquina?')) {
                    saveData(machines.filter(m => m.id !== id));
                    if (selectedMachine?.id === id) {
                        setSelectedMachine(null);
                        setCurrentView('machines');
                    }
                }
            };

            const addProduct = (name, quantity, expiryDate, cost, price) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const newProduct = {
                            id: Date.now().toString(),
                            name,
                            quantity: parseFloat(quantity),
                            expiryDate,
                            cost: parseFloat(cost),
                            price: parseFloat(price),
                            batches: [{
                                id: Date.now().toString() + '_batch_0',
                                quantity: parseFloat(quantity),
                                expiryDate,
                                cost: parseFloat(cost)
                            }]
                        };
                        return { ...m, products: [...m.products, newProduct] };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
                setShowAddProduct(false);
            };

            const deleteProduct = (productId) => {
                if (confirm('¿Eliminar este producto?')) {
                    const updatedMachines = machines.map(m => {
                        if (m.id === selectedMachine.id) {
                            return { ...m, products: m.products.filter(p => p.id !== productId) };
                        }
                        return m;
                    });
                    saveData(updatedMachines);
                    setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
                }
            };

            const quickUpdateProduct = (productId, field, value) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p =>
                                p.id === productId ? {
                                    ...p,
                                    [field]: (field === 'quantity' || field === 'cost' || field === 'price')
                                        ? parseFloat(value) || 0
                                        : value
                                } : p
                            )
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const addStock = (productId, amount, expiryDate, cost) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p => {
                                if (p.id === productId) {
                                    if (m.type === 'vending') {
                                        const newBatch = {
                                            id: Date.now().toString() + Math.random(),
                                            quantity: parseFloat(amount),
                                            expiryDate: expiryDate || p.expiryDate,
                                            cost: parseFloat(cost) || p.cost
                                        };
                                        const batches = [...(p.batches || []), newBatch];
                                        const totalQuantity = batches.reduce((sum, b) => sum + b.quantity, 0);
                                        return { ...p, batches, quantity: totalQuantity, cost: parseFloat(cost) || p.cost };
                                    }
                                    return { ...p, quantity: p.quantity + parseFloat(amount) };
                                }
                                return p;
                            })
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const addStockWithCost = (productId, amount, cost) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p =>
                                p.id === productId ? {
                                    ...p,
                                    quantity: p.quantity + parseFloat(amount),
                                    cost: parseFloat(cost) || p.cost
                                } : p
                            )
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const recordSale = (productId, quantitySold) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const product = m.products.find(p => p.id === productId);
                        if (product && product.quantity >= quantitySold) {
                            if (m.type === 'vending' && product.batches) {
                                let remaining = quantitySold;
                                const updatedBatches = [];
                                const sortedBatches = [...product.batches].sort((a, b) => {
                                    if (!a.expiryDate) return 1;
                                    if (!b.expiryDate) return -1;
                                    return new Date(a.expiryDate) - new Date(b.expiryDate);
                                });
                                for (const batch of sortedBatches) {
                                    if (remaining <= 0) {
                                        updatedBatches.push(batch);
                                    } else if (batch.quantity <= remaining) {
                                        remaining -= batch.quantity;
                                    } else {
                                        updatedBatches.push({ ...batch, quantity: batch.quantity - remaining });
                                        remaining = 0;
                                    }
                                }
                                const totalQuantity = updatedBatches.reduce((sum, b) => sum + b.quantity, 0);
                                const sale = {
                                    id: Date.now().toString(),
                                    productName: product.name,
                                    quantity: quantitySold,
                                    revenue: product.price * quantitySold,
                                    profit: (product.price - product.cost) * quantitySold,
                                    date: new Date().toISOString()
                                };
                                return {
                                    ...m,
                                    products: m.products.map(p =>
                                        p.id === productId ? { ...p, batches: updatedBatches, quantity: totalQuantity } : p
                                    ),
                                    sales: [...(m.sales || []), sale]
                                };
                            }
                            const sale = {
                                id: Date.now().toString(),
                                productName: product.name,
                                quantity: quantitySold,
                                revenue: product.price * quantitySold,
                                profit: (product.price - product.cost) * quantitySold,
                                date: new Date().toISOString()
                            };
                            return {
                                ...m,
                                products: m.products.map(p =>
                                    p.id === productId ? { ...p, quantity: p.quantity - quantitySold } : p
                                ),
                                sales: [...(m.sales || []), sale]
                            };
                        }
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const recordCoffeeSale = (totalRevenue) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const sale = {
                            id: Date.now().toString(),
                            productName: 'Recaudación Café',
                            revenue: parseFloat(totalRevenue),
                            profit: parseFloat(totalRevenue) * 0.7,
                            date: new Date().toISOString(),
                            isCoffeeSale: true
                        };
                        return { ...m, sales: [...(m.sales || []), sale] };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
                setShowCoffeeSalesModal(false);
            };

            const removeExpired = (productId, quantityExpired, batchId = null) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const product = m.products.find(p => p.id === productId);
                        if (product) {
                            const expiredRecord = {
                                id: Date.now().toString(),
                                productName: product.name,
                                quantity: quantityExpired,
                                date: new Date().toISOString()
                            };
                            if (m.type === 'vending' && product.batches && batchId) {
                                const updatedBatches = product.batches.map(batch => {
                                    if (batch.id === batchId) {
                                        const newQuantity = batch.quantity - quantityExpired;
                                        return newQuantity > 0 ? { ...batch, quantity: newQuantity } : null;
                                    }
                                    return batch;
                                }).filter(b => b !== null);
                                const totalQuantity = updatedBatches.reduce((sum, b) => sum + b.quantity, 0);
                                if (updatedBatches.length === 0) {
                                    return { ...m, products: m.products.filter(p => p.id !== productId), expired: [...(m.expired || []), expiredRecord] };
                                }
                                return {
                                    ...m,
                                    products: m.products.map(p =>
                                        p.id === productId ? { ...p, batches: updatedBatches, quantity: totalQuantity } : p
                                    ),
                                    expired: [...(m.expired || []), expiredRecord]
                                };
                            }
                            const newQuantity = product.quantity - quantityExpired;
                            if (newQuantity <= 0) {
                                return { ...m, products: m.products.filter(p => p.id !== productId), expired: [...(m.expired || []), expiredRecord] };
                            } else {
                                return {
                                    ...m,
                                    products: m.products.map(p =>
                                        p.id === productId ? { ...p, quantity: newQuantity } : p
                                    ),
                                    expired: [...(m.expired || []), expiredRecord]
                                };
                            }
                        }
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const updateBatchQuantity = (productId, batchId, newQuantity) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p => {
                                if (p.id === productId && p.batches) {
                                    const updatedBatches = p.batches.map(b =>
                                        b.id === batchId ? { ...b, quantity: parseFloat(newQuantity) || 0 } : b
                                    );
                                    const totalQuantity = updatedBatches.reduce((sum, b) => sum + b.quantity, 0);
                                    return { ...p, batches: updatedBatches, quantity: totalQuantity };
                                }
                                return p;
                            })
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const updateBatchExpiry = (productId, batchId, newExpiry) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p => {
                                if (p.id === productId && p.batches) {
                                    return {
                                        ...p,
                                        batches: p.batches.map(b =>
                                            b.id === batchId ? { ...b, expiryDate: newExpiry } : b
                                        )
                                    };
                                }
                                return p;
                            })
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const deleteBatch = (productId, batchId) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        return {
                            ...m,
                            products: m.products.map(p => {
                                if (p.id === productId && p.batches) {
                                    const updatedBatches = p.batches.filter(b => b.id !== batchId);
                                    const totalQuantity = updatedBatches.reduce((sum, b) => sum + b.quantity, 0);
                                    return { ...p, batches: updatedBatches, quantity: totalQuantity };
                                }
                                return p;
                            }).filter(p => !p.batches || p.batches.length > 0)
                        };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
            };

            const addCashMovement = (type, amount) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const movement = {
                            id: Date.now().toString(),
                            type: type,
                            amount: parseFloat(amount),
                            date: new Date().toISOString()
                        };
                        return { ...m, cashMovements: [...(m.cashMovements || []), movement] };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
                setShowCashModal(false);
            };

            const addVisit = (location, date, moneyAction, moneyAmount, productsRestocked, vehicle) => {
                const updatedMachines = machines.map(m => {
                    if (m.id === selectedMachine.id) {
                        const visit = {
                            id: Date.now().toString(),
                            location,
                            date,
                            moneyAction,
                            moneyAmount: parseFloat(moneyAmount) || 0,
                            productsRestocked: parseInt(productsRestocked) || 0,
                            vehicle,
                            createdAt: new Date().toISOString()
                        };
                        return { ...m, visits: [...(m.visits || []), visit] };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === selectedMachine.id));
                setShowVisitModal(false);
            };

            const initializeCoffeeMachine = (machineId) => {
                const coffeeProducts = [
                    { name: 'Café Normal', unit: 'kg' },
                    { name: 'Café Descafeinado', unit: 'kg' },
                    { name: 'Leche en Polvo', unit: 'kg' },
                    { name: 'Chocolate', unit: 'kg' },
                    { name: 'Té', unit: 'kg' },
                    { name: 'Agua', unit: 'L' }
                ];
                const updatedMachines = machines.map(m => {
                    if (m.id === machineId) {
                        const newProducts = coffeeProducts.map(cp => ({
                            id: Date.now().toString() + Math.random(),
                            name: cp.name,
                            quantity: 0,
                            unit: cp.unit,
                            expiryDate: '',
                            cost: 0,
                            price: 0
                        }));
                        return { ...m, products: newProducts };
                    }
                    return m;
                });
                saveData(updatedMachines);
                setSelectedMachine(updatedMachines.find(m => m.id === machineId));
            };

            const getTotalRevenue = (machine) => (machine.sales || []).reduce((sum, sale) => sum + sale.revenue, 0);
            const getTotalProfit = (machine) => (machine.sales || []).reduce((sum, sale) => sum + sale.profit, 0);
            const getCurrentCash = (machine) => (machine.cashMovements || []).reduce((sum, mov) => mov.type === 'add' ? sum + mov.amount : sum - mov.amount, 0);

            const downloadPDF = () => {
                const isCoffee = selectedMachine.type === 'coffee';
                const totalRevenue = getTotalRevenue(selectedMachine);
                const totalProfit = getTotalProfit(selectedMachine);
                const currentCash = getCurrentCash(selectedMachine);
                const salesCount = (selectedMachine.sales || []).length;

                const htmlContent = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;margin:40px;color:#333}
.header{text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:3px solid ${isCoffee?'#d97706':'#2563eb'}}
h1{color:${isCoffee?'#d97706':'#2563eb'};margin:10px 0}
.subtitle{color:#666;font-size:14px}
.info-box{background:#f3f4f6;padding:15px;border-radius:8px;margin:20px 0}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
.info-row:last-child{border-bottom:none}
.label{font-weight:bold;color:#555}
.highlight-box{background:${isCoffee?'#fef3c7':'#dbeafe'};border-left:4px solid ${isCoffee?'#d97706':'#2563eb'};padding:15px;margin:15px 0}
.metric{display:inline-block;margin:10px 20px 10px 0}
.metric-value{font-size:24px;font-weight:bold;color:${isCoffee?'#d97706':'#2563eb'}}
.metric-label{font-size:12px;color:#666;text-transform:uppercase}
.section{margin:30px 0}
.section-title{background:${isCoffee?'#d97706':'#2563eb'};color:white;padding:10px 15px;border-radius:5px;font-size:18px;font-weight:bold;margin-bottom:15px}
table{width:100%;border-collapse:collapse;margin:15px 0}
th{background:${isCoffee?'#fef3c7':'#dbeafe'};padding:12px;text-align:left;font-weight:bold;border:1px solid #ddd}
td{padding:10px 12px;border:1px solid #ddd}
tr:nth-child(even){background:#f9fafb}
.footer{margin-top:40px;padding-top:20px;border-top:2px solid #ddd;text-align:center;color:#666;font-size:12px}
</style></head><body>
<div class="header">
<h1>REPORTE DE GESTION</h1>
<div class="subtitle">${selectedMachine.name} - ${selectedMachine.location}</div>
<div class="subtitle">${new Date().toLocaleDateString('es-ES')}</div>
</div>
<div class="info-box">
<div class="info-row"><span class="label">Tipo:</span><span>${isCoffee?'Maquina de Cafe':'Vending'}</span></div>
<div class="info-row"><span class="label">Ubicacion:</span><span>${selectedMachine.location}</span></div>
</div>
<div class="highlight-box">
<div class="metric"><div class="metric-value">${totalRevenue.toFixed(2)} EUR</div><div class="metric-label">Total Ventas</div></div>
<div class="metric"><div class="metric-value">${totalProfit.toFixed(2)} EUR</div><div class="metric-label">Beneficio Total</div></div>
<div class="metric"><div class="metric-value">${currentCash.toFixed(2)} EUR</div><div class="metric-label">Dinero en Maquina</div></div>
<div class="metric"><div class="metric-value">${salesCount}</div><div class="metric-label">Ventas</div></div>
</div>
<div class="section"><div class="section-title">Stock Actual</div><table><thead><tr><th>Producto</th><th>Cantidad</th>${isCoffee?'<th>Coste</th>':'<th>Precio</th><th>Caducidad</th>'}</tr></thead><tbody>
${selectedMachine.products.map(p=>`<tr><td>${p.name}</td><td>${isCoffee?p.quantity.toFixed(1)+' '+p.unit:p.quantity+' uds'}</td>${isCoffee?`<td>${(p.cost||0).toFixed(2)} EUR/${p.unit}</td>`:`<td>${p.price.toFixed(2)} EUR</td><td>${p.expiryDate}</td>`}</tr>`).join('')}
</tbody></table></div>
<div class="section"><div class="section-title">Ultimas Ventas</div><table><thead><tr><th>Fecha</th><th>Producto</th>${!isCoffee?'<th>Cantidad</th>':''}<th>Importe</th></tr></thead><tbody>
${(selectedMachine.sales||[]).slice(-10).reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString('es-ES')}</td><td>${s.productName}</td>${!isCoffee?`<td>${s.quantity}</td>`:''}<td>${s.revenue.toFixed(2)} EUR</td></tr>`).join('')||'<tr><td colspan="4">Sin ventas</td></tr>'}
</tbody></table></div>
<div class="section"><div class="section-title">Movimientos de Dinero</div><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th></tr></thead><tbody>
${(selectedMachine.cashMovements||[]).slice(-10).reverse().map(m=>`<tr><td>${new Date(m.date).toLocaleString('es-ES')}</td><td>${m.type==='add'?'Metido':'Retirado'}</td><td>${m.type==='add'?'+':'-'}${m.amount.toFixed(2)} EUR</td></tr>`).join('')||'<tr><td colspan="3">Sin movimientos</td></tr>'}
</tbody></table></div>
<div class="section"><div class="section-title">Visitas</div><table><thead><tr><th>Fecha</th><th>Ubicacion</th><th>Dinero</th><th>Productos repuestos</th><th>Vehiculo</th></tr></thead><tbody>
${(selectedMachine.visits||[]).slice(-20).reverse().map(v=>`<tr><td>${new Date(v.date).toLocaleDateString('es-ES')}</td><td>${v.location}</td><td>${v.moneyAction==='collected'?'Recaudado':'Dejado'}: ${v.moneyAmount.toFixed(2)} EUR</td><td>${v.productsRestocked} uds</td><td>${v.vehicle||'-'}</td></tr>`).join('')||'<tr><td colspan="5">Sin visitas</td></tr>'}
</tbody></table></div>
${!isCoffee?`<div class="section"><div class="section-title">Productos Retirados</div><table><thead><tr><th>Fecha</th><th>Producto</th><th>Cantidad</th></tr></thead><tbody>
${(selectedMachine.expired||[]).slice(-10).reverse().map(e=>`<tr><td>${new Date(e.date).toLocaleString('es-ES')}</td><td>${e.productName}</td><td>${e.quantity} uds</td></tr>`).join('')||'<tr><td colspan="3">Sin productos caducados</td></tr>'}
</tbody></table></div>`:''}
<div class="footer"><p>Reporte generado por Vending Vagalume - ${new Date().toLocaleDateString('es-ES')}</p></div>
</body></html>`;

                const printWindow = window.open('', '_blank');
                printWindow.document.write(htmlContent);
                printWindow.document.close();
                setTimeout(() => printWindow.print(), 500);
                setShowEmailModal(false);
            };

            const AddMachineForm = () => {
                const [name, setName] = useState('');
                const [location, setLocation] = useState('');
                const [type, setType] = useState('vending');

                return (
                    <div className="bg-white rounded-xl p-5 mb-4 shadow-xl border border-indigo-100">
                        <h3 className="font-bold text-lg mb-4 text-indigo-900">Nueva Máquina</h3>
                        <div className="mb-4">
                            <label className="block text-sm font-semibold mb-2 text-gray-700">Tipo de Máquina</label>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => setType('vending')} className={`py-3 rounded-lg font-semibold ${type === 'vending' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600'}`}>🍫 Vending</button>
                                <button onClick={() => setType('coffee')} className={`py-3 rounded-lg font-semibold ${type === 'coffee' ? 'bg-amber-600 text-white' : 'bg-gray-200 text-gray-600'}`}>☕ Café</button>
                            </div>
                        </div>

                                                            <h5 className="font-bold text-sm mb-2 text-gray-700">📦 Lotes ({batches.length})</h5>
                                                            <div className="space-y-2 max-h-64 overflow-y-auto">
                                                                {batches.map((batch, index) => {
                                                                    const batchExpiry = batch.expiryDate ? new Date(batch.expiryDate) : null;
                                                                    const daysUntilExpiry = batchExpiry ? Math.ceil((batchExpiry - today) / (1000 * 60 * 60 * 24)) : null;
                                                                    const batchExpired = daysUntilExpiry !== null && daysUntilExpiry < 0;
                                                                    const batchExpiringSoon = daysUntilExpiry !== null && daysUntilExpiry >= 0 && daysUntilExpiry <= 7;

                                                                    return (
                                                                        <div key={batch.id} className={`p-2 rounded-lg border ${batchExpired ? 'bg-red-100 border-red-400' : batchExpiringSoon ? 'bg-orange-100 border-orange-400' : 'bg-gray-50 border-gray-300'}`}>
                                                                            <div className="flex justify-between items-center mb-2">
                                                                                <span className="text-xs font-semibold text-gray-700">Lote #{index + 1}</span>
                                                                                <button onClick={() => { if (confirm('¿Eliminar este lote?')) deleteBatch(product.id, batch.id); }} className="text-red-500 text-sm">🗑️</button>
                                                                            </div>
                                                                            <div className="grid grid-cols-2 gap-2 mb-2">
                                                                                <div>
                                                                                    <label className="text-xs text-gray-600">Cantidad</label>
                                                                                    <input type="number" step="1" value={batch.quantity} onChange={(e) => updateBatchQuantity(product.id, batch.id, e.target.value)} className="w-full text-sm font-bold text-center border-2 border-blue-300 rounded p-1" />
                                                                                </div>
                                                                                <div>
                                                                                    <label className="text-xs text-gray-600">Coste</label>
                                                                                    <input type="number" step="0.01" value={batch.cost || 0} readOnly className="w-full text-sm font-bold text-center border-2 border-gray-300 rounded p-1 bg-gray-100" />
                                                                                </div>
                                                                            </div>
                                                                            <div>
                                                                                <label className="text-xs text-gray-600">Fecha de caducidad</label>
                                                                                <input type="date" value={batch.expiryDate || ''} onChange={(e) => updateBatchExpiry(product.id, batch.id, e.target.value)} className="w-full text-xs border-2 border-purple-300 rounded p-1" />
                                                                                {daysUntilExpiry !== null && (
                                                                                    <p className={`text-xs mt-1 font-semibold ${batchExpired ? 'text-red-600' : batchExpiringSoon ? 'text-orange-600' : 'text-green-600'}`}>
                                                                                        {batchExpired ? `⚠️ Caducado hace ${Math.abs(daysUntilExpiry)} días` : batchExpiringSoon ? `⏰ Caduca en ${daysUntilExpiry} días` : `✅ Caduca en ${daysUntilExpiry} días`}
                                                                                    </p>
                                                                                )}
                                                                            </div>
                                                                            <button onClick={() => { const qty = prompt(`¿Cuántas unidades retirar del lote #${index + 1}? (Máx: ${batch.quantity})`); if (qty && parseInt(qty) > 0 && parseInt(qty) <= batch.quantity) { removeExpired(product.id, parseInt(qty), batch.id); } else if (qty && parseInt(qty) > batch.quantity) { alert('No puedes retirar más unidades de las que hay en el lote'); } }} className="w-full bg-orange-500 text-white py-1 px-2 rounded text-xs font-semibold mt-2">🗑️ Retirar caducados</button>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>

                                                        <div className="mb-3 p-3 bg-green-50 border border-green-200 rounded-lg">
                                                            <h5 className="font-bold text-sm mb-2 text-green-800">➕ Añadir Nuevo Lote</h5>
                                                            <button onClick={() => { const qty = prompt('¿Cuántas unidades añadir?'); if (qty && parseInt(qty) > 0) { const expiry = prompt('Fecha de caducidad (YYYY-MM-DD):'); const cost = prompt('Coste por unidad (€):'); if (expiry && cost) { addStock(product.id, parseInt(qty), expiry, parseFloat(cost)); } else { alert('Debes proporcionar fecha de caducidad y coste'); } } }} className="w-full bg-green-600 text-white py-2 rounded-lg font-bold">➕ Añadir Lote</button>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-2">
                                                            <button onClick={() => { const qty = prompt('¿Cuántas unidades vendidas?'); if (qty && parseInt(qty) > 0) { if (parseInt(qty) <= product.quantity) { recordSale(product.id, parseInt(qty)); } else { alert('No hay suficiente stock'); } } }} className="bg-blue-600 text-white py-2 rounded-lg font-semibold">💰 Vender</button>
                                                            <button onClick={() => quickUpdateProduct(product.id, 'price', prompt('Nuevo precio de venta (€):', product.price) || product.price)} className="bg-purple-600 text-white py-2 rounded-lg font-semibold">💵 Precio</button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>

                                    {selectedMachine.products.length === 0 && (
                                        <div className="text-center text-gray-500 mt-8">
                                            <p className="text-4xl mb-2">📦</p>
                                            <p>No hay productos. Añade el primero.</p>
                                        </div>
                                    )}
                                </>
                            )}

                            {activeTab === 'sales' && (
                                <div className="space-y-3">
                                    {(selectedMachine.sales || []).slice().reverse().map(sale => (
                                        <div key={sale.id} className="bg-white p-4 rounded-lg shadow">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold">{sale.productName}</h4>
                                                    {sale.isCoffeeSale ? (
                                                        <>
                                                            <p className="text-sm text-gray-600">Recaudación total: {sale.revenue.toFixed(2)}€</p>
                                                            <p className="text-xs text-green-600">Beneficio estimado: {sale.profit.toFixed(2)}€</p>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <p className="text-sm text-gray-600">Cantidad: {sale.quantity} | Ingreso: {sale.revenue.toFixed(2)}€</p>
                                                            <p className="text-xs text-green-600">Beneficio: {sale.profit.toFixed(2)}€</p>
                                                        </>
                                                    )}
                                                    <p className="text-xs text-gray-400">{new Date(sale.date).toLocaleString('es-ES')}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {(selectedMachine.sales || []).length === 0 && (
                                        <div className="text-center text-gray-500 mt-8">
                                            <p className="text-4xl mb-2">💰</p>
                                            <p>No hay ventas registradas</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'cash' && (
                                <>
                                    <div className={`${isCoffee ? 'bg-gradient-to-r from-amber-500 to-amber-600' : 'bg-gradient-to-r from-blue-500 to-blue-600'} text-white p-6 rounded-xl mb-4 shadow-lg`}>
                                        <p className="text-sm opacity-90 mb-1">Dinero actual en máquina</p>
                                        <p className="text-4xl font-bold">{getCurrentCash(selectedMachine).toFixed(2)}€</p>
                                    </div>
                                    <button onClick={() => setShowCashModal(true)} className={`w-full ${isCoffee ? 'bg-amber-600' : 'bg-blue-600'} text-white py-4 rounded-xl mb-4 font-bold`}>💸 Registrar Movimiento</button>
                                    <div className="space-y-3">
                                        {(selectedMachine.cashMovements || []).slice().reverse().map(mov => (
                                            <div key={mov.id} className={`bg-white p-4 rounded-lg shadow border-l-4 ${mov.type === 'add' ? 'border-green-500' : 'border-red-500'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="font-bold">{mov.type === 'add' ? '💰 Dinero metido' : '💸 Dinero retirado'}</h4>
                                                        <p className={`text-lg font-semibold ${mov.type === 'add' ? 'text-green-600' : 'text-red-600'}`}>{mov.type === 'add' ? '+' : '-'}{mov.amount.toFixed(2)}€</p>
                                                        <p className="text-xs text-gray-400 mt-1">{new Date(mov.date).toLocaleString('es-ES')}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {(selectedMachine.cashMovements || []).length === 0 && (
                                            <div className="text-center text-gray-500 mt-8">
                                                <p className="text-4xl mb-2">💵</p>
                                                <p>No hay movimientos de dinero</p>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}

                            {activeTab === 'stats' && (
                                <div className="space-y-4">
                                    <div className="bg-white p-5 rounded-xl shadow">
                                        <h3 className="font-bold mb-4">Resumen Financiero</h3>
                                        <div className="space-y-3">
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Total ventas:</span>
                                                <span className="font-bold text-green-600">{getTotalRevenue(selectedMachine).toFixed(2)}€</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Beneficio total:</span>
                                                <span className="font-bold text-emerald-600">{getTotalProfit(selectedMachine).toFixed(2)}€</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Número de ventas:</span>
                                                <span className="font-bold text-blue-600">{(selectedMachine.sales || []).length}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Dinero en máquina:</span>
                                                <span className="font-bold text-purple-600">{getCurrentCash(selectedMachine).toFixed(2)}€</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Total visitas:</span>
                                                <span className="font-bold text-teal-600">{(selectedMachine.visits || []).length}</span>
                                            </div>
                                        </div>
                                    </div>
                                    {!isCoffee && selectedMachine.products.length > 0 && (
                                        <div className="bg-white p-5 rounded-xl shadow">
                                            <h3 className="font-bold mb-4">Stock Actual</h3>
                                            <div className="space-y-2">
                                                {selectedMachine.products.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center">
                                                        <span className="text-sm text-gray-700">{p.name}</span>
                                                        <span className={`font-bold text-sm ${p.quantity < 5 ? 'text-red-600' : 'text-green-600'}`}>{p.quantity} uds</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => setShowEmailModal(true)} className="w-full bg-gradient-to-r from-purple-500 to-purple-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg">📄 Generar PDF</button>
                                </div>
                            )}

                            {activeTab === 'visits' && (
                                <>
                                    <button onClick={() => setShowVisitModal(true)} className="w-full bg-gradient-to-r from-teal-500 to-teal-700 text-white py-4 rounded-xl mb-4 font-bold text-lg shadow-lg">📍 Registrar Nueva Visita</button>
                                    <div className="space-y-3">
                                        {(selectedMachine.visits || []).slice().reverse().map(visit => (
                                            <div key={visit.id} className="bg-white p-4 rounded-xl shadow-lg border-2 border-teal-200">
                                                <div className="flex justify-between items-start mb-3">
                                                    <h4 className="font-bold text-teal-800 text-lg">📍 {visit.location}</h4>
                                                    <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded-full">{new Date(visit.date).toLocaleDateString('es-ES')}</span>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div className={`p-3 rounded-lg ${visit.moneyAction === 'collected' ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                                                        <p className="text-xs text-gray-500 mb-1">Dinero</p>
                                                        <p className={`font-bold text-sm ${visit.moneyAction === 'collected' ? 'text-green-700' : 'text-red-700'}`}>{visit.moneyAction === 'collected' ? '💰 Recaudado' : '💸 Dejado'}</p>
                                                        <p className={`font-bold text-lg ${visit.moneyAction === 'collected' ? 'text-green-600' : 'text-red-600'}`}>{visit.moneyAmount.toFixed(2)}€</p>
                                                    </div>
                                                    <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg">
                                                        <p className="text-xs text-gray-500 mb-1">Productos repuestos</p>
                                                        <p className="font-bold text-2xl text-blue-700">{visit.productsRestocked}</p>
                                                        <p className="text-xs text-blue-600">unidades</p>
                                                    </div>
                                                    <div className="bg-purple-50 border border-purple-200 p-3 rounded-lg col-span-2">
                                                        <p className="text-xs text-gray-500 mb-1">Vehículo utilizado</p>
                                                        <p className="font-bold text-purple-700">🚗 {visit.vehicle || '-'}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {(selectedMachine.visits || []).length === 0 && (
                                            <div className="text-center text-gray-500 mt-8">
                                                <p className="text-4xl mb-2">🗺️</p>
                                                <p>No hay visitas registradas</p>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>

                        {showCashModal && <CashModal />}
                        {showCoffeeSalesModal && <CoffeeSalesModal />}
                        {showEmailModal && <EmailModal />}
                        {showVisitModal && <VisitModal />}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VendingManager />);
    </script>
</body>
</html>
