                                const sortedBatches = [...product.batches].sort((a, b) => {

                                    if (!b.expiryDate) return -1;
                                    return new Date(a.expiryDate) - new Date(b.expiryDate);
                                });
                                
                                // Restar del lote más antiguo primero
                                for (const batch of sortedBatches) {

                                        updatedBatches.push(batch);
                                    } else if (batch.quantity <= remaining) {
                                        remaining -= batch.quantity;
                                        // No añadir este lote (se vendió completamente)
                                    } else {
                                        updatedBatches.push({

                                </button>
                                <button
                                    onClick={() => setActiveTab('cash')}
                                    className={`py-3 px-2 rounded-lg font-semibold text-sm ${
                                        activeTab === 'cash' 
                                            ? isCoffee 
                                                ? 'bg-gradient-to-r from-amber-500 to-amber-700 text-white shadow-lg'
                                                : 'bg-gradient-to-r from-blue-500 to-blue-700 text-white shadow-lg'
                                            : 'bg-white text-gray-600'
                                    }`}
                                >
                                    💰 Dinero
                                </button>
                                <button
                                    onClick={() => setActiveTab('stats')}
                                    className={`py-3 px-2 rounded-lg font-semibold text-sm ${
                                        activeTab === 'stats' 
                                            ? isCoffee 
                                                ? 'bg-gradient-to-r from-amber-500 to-amber-700 text-white shadow-lg'
                                                : 'bg-gradient-to-r from-blue-500 to-blue-700 text-white shadow-lg'
                                            : 'bg-white text-gray-600'
                                    }`}
                                >
                                    📈 Estadísticas
                                </button>
                            </div>

                            {activeTab === 'restock' && (
                                <>
                                    <button
                                        onClick={() => setShowCashModal(true)}
                                        className="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl mb-4 font-bold text-lg shadow-lg"
                                    >
                                        💸 Retirar/Meter Dinero
                                    </button>

                                    {isCoffee && (
                                        <button
                                            onClick={() => setShowCoffeeSalesModal(true)}
                                            className="w-full bg-gradient-to-r from-amber-500 to-amber-700 text-white py-4 rounded-xl mb-4 font-bold text-lg shadow-lg"
                                        >
                                            ☕ Registrar Recaudación
                                        </button>
                                    )}

                                    {!isCoffee && (
                                        <button
                                            onClick={() => setShowAddProduct(true)}
                                            className="w-full bg-blue-600 text-white py-3 rounded-xl mb-4 font-semibold"
                                        >
                                            + Añadir Nuevo Producto
                                        </button>
                                    )}

                                    {showAddProduct && <AddProductForm />}

                                    <div className="space-y-3">
                                        {isCoffee ? (
                                            selectedMachine.products.map(product => (
                                                <CoffeeProductCard key={product.id} product={product} />
                                            ))
                                        ) : (
                                            selectedMachine.products.map(product => {
                                                const today = new Date();
                                                const batches = product.batches || [];
                                                
                                                // Calcular alertas considerando todos los lotes
                                                let hasExpiredBatch = false;
                                                let hasExpiringSoonBatch = false;
                                                
                                                batches.forEach(batch => {
                                                    if (batch.expiryDate) {
                                                        const expiry = new Date(batch.expiryDate);
                                                        const daysUntil = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
                                                        if (daysUntil < 0) hasExpiredBatch = true;
                                                        if (daysUntil >= 0 && daysUntil <= 7) hasExpiringSoonBatch = true;
                                                    }
                                                });
                                                
                                                const isLowStock = product.quantity < 5;

                                                return (
                                                    <div 
                                                        key={product.id} 
                                                        className={`bg-white p-4 rounded-xl shadow-lg border-2 ${
                                                            hasExpiredBatch ? 'border-red-500 bg-red-50' : 
                                                            hasExpiringSoonBatch ? 'border-orange-400 bg-orange-50' :
                                                            isLowStock ? 'border-yellow-400 bg-yellow-50' : 'border-gray-200'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-start mb-3">
                                                            <div className="flex-1">
                                                                <h4 className="font-bold text-lg">{product.name}</h4>
                                                                <div className="flex gap-2 mt-1 flex-wrap">
                                                                    {hasExpiredBatch && <span className="text-xs bg-red-600 text-white px-2 py-1 rounded-full font-semibold">⚠️ LOTES CADUCADOS</span>}
                                                                    {hasExpiringSoonBatch && !hasExpiredBatch && <span className="text-xs bg-orange-500 text-white px-2 py-1 rounded-full font-semibold">⏰ Lotes por caducar</span>}
                                                                    {isLowStock && <span className="text-xs bg-yellow-600 text-white px-2 py-1 rounded-full font-semibold">📦 Stock bajo</span>}
                                                                </div>
                                                            </div>
                                                            <button
                                                                onClick={() => deleteProduct(product.id)}
                                                                className="text-red-500 text-xl ml-2"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>

                                                        <div className="bg-blue-50 p-3 rounded-lg mb-3 border border-blue-200">
                                                            <p className="text-xs text-gray-600 mb-1">Stock Total</p>
                                                            <p className="text-3xl font-bold text-blue-700">{product.quantity} uds</p>
                                                            <p className="text-xs text-gray-600 mt-1">Precio de venta: {product.price.toFixed(2)}€</p>
                                                        </div>

                                                        <div className="mb-3">
                                                            <h5 className="font-bold text-sm mb-2 text-gray-700">📦 Lotes ({batches.length})</h5>
                                                            <div className="space-y-2 max-h-64 overflow-y-auto">
                                                                {batches.map((batch, index) => {
                                                                    const batchExpiry = batch.expiryDate ? new Date(batch.expiryDate) : null;
                                                                    const daysUntilExpiry = batchExpiry ? Math.ceil((batchExpiry - today) / (1000 * 60 * 60 * 24)) : null;
                                                                    const batchExpired = daysUntilExpiry !== null && daysUntilExpiry < 0;
                                                                    const batchExpiringSoon = daysUntilExpiry !== null && daysUntilExpiry >= 0 && daysUntilExpiry <= 7;
                                                                    
                                                                    return (
                                                                        <div key={batch.id} className={`p-2 rounded-lg border ${
                                                                            batchExpired ? 'bg-red-100 border-red-400' :
                                                                            batchExpiringSoon ? 'bg-orange-100 border-orange-400' :
                                                                            'bg-gray-50 border-gray-300'
                                                                        }`}>
                                                                            <div className="flex justify-between items-center mb-2">
                                                                                <span className="text-xs font-semibold text-gray-700">Lote #{index + 1}</span>
                                                                                <button
                                                                                    onClick={() => {
                                                                                        if (confirm('¿Eliminar este lote?')) {
                                                                                            deleteBatch(product.id, batch.id);
                                                                                        }
                                                                                    }}
                                                                                    className="text-red-500 text-sm"
                                                                                >
                                                                                    🗑️
                                                                                </button>
                                                                            </div>
                                                                            <div className="grid grid-cols-2 gap-2 mb-2">
                                                                                <div>
                                                                                    <label className="text-xs text-gray-600">Cantidad</label>
                                                                                    <input
                                                                                        type="number"
                                                                                        step="1"
                                                                                        value={batch.quantity}
                                                                                        onChange={(e) => updateBatchQuantity(product.id, batch.id, e.target.value)}
                                                                                        className="w-full text-sm font-bold text-center border-2 border-blue-300 rounded p-1"
                                                                                    />
                                                                                </div>
                                                                                <div>
                                                                                    <label className="text-xs text-gray-600">Coste</label>
                                                                                    <input
                                                                                        type="number"
                                                                                        step="0.01"
                                                                                        value={batch.cost || 0}
                                                                                        readOnly
                                                                                        className="w-full text-sm font-bold text-center border-2 border-gray-300 rounded p-1 bg-gray-100"
                                                                                    />
                                                                                </div>
                                                                            </div>
                                                                            <div>
                                                                                <label className="text-xs text-gray-600">Fecha de caducidad</label>
                                                                                <input
                                                                                    type="date"
                                                                                    value={batch.expiryDate || ''}
                                                                                    onChange={(e) => updateBatchExpiry(product.id, batch.id, e.target.value)}
                                                                                    className="w-full text-xs border-2 border-purple-300 rounded p-1"
                                                                                />
                                                                                {daysUntilExpiry !== null && (
                                                                                    <p className={`text-xs mt-1 font-semibold ${
                                                                                        batchExpired ? 'text-red-600' :
                                                                                        batchExpiringSoon ? 'text-orange-600' :
                                                                                        'text-green-600'
                                                                                    }`}>
                                                                                        {batchExpired ? `⚠️ Caducado hace ${Math.abs(daysUntilExpiry)} días` :
                                                                                         batchExpiringSoon ? `⏰ Caduca en ${daysUntilExpiry} días` :
                                                                                         `✅ Caduca en ${daysUntilExpiry} días`}
                                                                                    </p>
                                                                                )}
                                                                            </div>
                                                                            <button
                                                                                onClick={() => {
                                                                                    const qty = prompt(`¿Cuántas unidades retirar del lote #${index + 1}? (Máx: ${batch.quantity})`);
                                                                                    if (qty && parseInt(qty) > 0 && parseInt(qty) <= batch.quantity) {
                                                                                        removeExpired(product.id, parseInt(qty), batch.id);
                                                                                    } else if (qty && parseInt(qty) > batch.quantity) {
                                                                                        alert('No puedes retirar más unidades de las que hay en el lote');
                                                                                    }
                                                                                }}
                                                                                className="w-full bg-orange-500 text-white py-1 px-2 rounded text-xs font-semibold mt-2"
                                                                            >
                                                                                🗑️ Retirar caducados
                                                                            </button>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>

                                                        <div className="mb-3 p-3 bg-green-50 border border-green-200 rounded-lg">
                                                            <h5 className="font-bold text-sm mb-2 text-green-800">➕ Añadir Nuevo Lote</h5>
                                                            <button
                                                                onClick={() => {
                                                                    const qty = prompt('¿Cuántas unidades añadir?');
                                                                    if (qty && parseInt(qty) > 0) {
                                                                        const expiry = prompt('Fecha de caducidad (YYYY-MM-DD):');
                                                                        const cost = prompt('Coste por unidad (€):');
                                                                        if (expiry && cost) {
                                                                            addStock(product.id, parseInt(qty), expiry, parseFloat(cost));
                                                                        } else {
                                                                            alert('Debes proporcionar fecha de caducidad y coste');
                                                                        }
                                                                    }
                                                                }}
                                                                className="w-full bg-green-600 text-white py-2 rounded-lg font-bold"
                                                            >
                                                                ➕ Añadir Lote
                                                            </button>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-2">
                                                            <button
                                                                onClick={() => {
                                                                    const qty = prompt('¿Cuántas unidades vendidas?');
                                                                    if (qty && parseInt(qty) > 0) {
                                                                        if (parseInt(qty) <= product.quantity) {
                                                                            recordSale(product.id, parseInt(qty));
                                                                        } else {
                                                                            alert('No hay suficiente stock');
                                                                        }
                                                                    }
                                                                }}
                                                                className="bg-blue-600 text-white py-2 rounded-lg font-semibold"
                                                            >
                                                                💰 Vender
                                                            </button>
                                                            <button
                                                                onClick={() => quickUpdateProduct(product.id, 'price', prompt('Nuevo precio de venta (€):', product.price) || product.price)}
                                                                className="bg-purple-600 text-white py-2 rounded-lg font-semibold"
                                                            >
                                                                💵 Precio
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>

                                    {selectedMachine.products.length === 0 && (
                                        <div className="text-center text-gray-500 mt-8">
                                            <p className="text-4xl mb-2">📦</p>
                                            <p>No hay productos. Añade el primero.</p>
                                        </div>
                                    )}
                                </>
                            )}

                            {activeTab === 'sales' && (
                                <div className="space-y-3">
                                    {(selectedMachine.sales || []).slice().reverse().map(sale => (
                                        <div key={sale.id} className="bg-white p-4 rounded-lg shadow">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold">{sale.productName}</h4>
                                                    {sale.isCoffeeSale ? (
                                                        <>
                                                            <p className="text-sm text-gray-600">
                                                                Recaudación total: {sale.revenue.toFixed(2)}€
                                                            </p>
                                                            <p className="text-xs text-green-600">
                                                                Beneficio estimado: {sale.profit.toFixed(2)}€
                                                            </p>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <p className="text-sm text-gray-600">
                                                                Cantidad: {sale.quantity} | Ingreso: {sale.revenue.toFixed(2)}€
                                                            </p>
                                                            <p className="text-xs text-green-600">
                                                                Beneficio: {sale.profit.toFixed(2)}€
                                                            </p>
                                                        </>
                                                    )}
                                                    <p className="text-xs text-gray-400">
                                                        {new Date(sale.date).toLocaleString('es-ES')}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {(selectedMachine.sales || []).length === 0 && (
                                        <div className="text-center text-gray-500 mt-8">
                                            <p className="text-4xl mb-2">💰</p>
                                            <p>No hay ventas registradas</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'cash' && (
                                <>
                                    <div className={`${
                                        isCoffee 
                                            ? 'bg-gradient-to-r from-amber-500 to-amber-600' 
                                            : 'bg-gradient-to-r from-blue-500 to-blue-600'
                                    } text-white p-6 rounded-xl mb-4 shadow-lg`}>
                                        <p className="text-sm opacity-90 mb-1">Dinero actual en máquina</p>
                                        <p className="text-4xl font-bold">{getCurrentCash(selectedMachine).toFixed(2)}€</p>
                                    </div>

                                    <button
                                        onClick={() => setShowCashModal(true)}
                                        className={`w-full ${
                                            isCoffee ? 'bg-amber-600' : 'bg-blue-600'
                                        } text-white py-4 rounded-xl mb-4 font-bold`}
                                    >
                                        💸 Registrar Movimiento
                                    </button>

                                    <div className="space-y-3">
                                        {(selectedMachine.cashMovements || []).slice().reverse().map(mov => (
                                            <div 
                                                key={mov.id} 
                                                className={`bg-white p-4 rounded-lg shadow border-l-4 ${
                                                    mov.type === 'add' ? 'border-green-500' : 'border-red-500'
                                                }`}
                                            >
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="font-bold">
                                                            {mov.type === 'add' ? '💰 Dinero metido' : '💸 Dinero retirado'}
                                                        </h4>
                                                        <p className={`text-lg font-semibold ${
                                                            mov.type === 'add' ? 'text-green-600' : 'text-red-600'
                                                        }`}>
                                                            {mov.type === 'add' ? '+' : '-'}{mov.amount.toFixed(2)}€
                                                        </p>
                                                        <p className="text-xs text-gray-400 mt-1">
                                                            {new Date(mov.date).toLocaleString('es-ES')}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {(selectedMachine.cashMovements || []).length === 0 && (
                                            <div className="text-center text-gray-500 mt-8">
                                                <p className="text-4xl mb-2">💵</p>
                                                <p>No hay movimientos de dinero</p>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}

                            {activeTab === 'stats' && (
                                <div className="space-y-4">
                                    <div className="bg-white p-5 rounded-xl shadow">
                                        <h3 className="font-bold mb-4">Resumen Financiero</h3>
                                        <div className="space-y-3">
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Total ventas:</span>
                                                <span className="font-bold text-green-600">
                                                    {getTotalRevenue(selectedMachine).toFixed(2)}€
                                                </span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Beneficio total:</span>
                                                <span className="font-bold text-emerald-600">
                                                    {getTotalProfit(selectedMachine).toFixed(2)}€
                                                </span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Número de ventas:</span>
                                                <span className="font-bold text-blue-600">
                                                    {(selectedMachine.sales || []).length}
                                                </span>
                                            </div>
                                            <div className="flex justify-between border-t pt-3">
                                                <span className="text-gray-600">Dinero en máquina:</span>
                                                <span className="font-bold text-purple-600">
                                                    {getCurrentCash(selectedMachine).toFixed(2)}€
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {!isCoffee && (
                                        <div className="bg-white p-5 rounded-xl shadow">
                                            <h3 className="font-bold mb-4">Productos Caducados</h3>
                                            {(selectedMachine.expired || []).length > 0 ? (
                                                <div className="space-y-2">
                                                    {selectedMachine.expired.slice().reverse().map(exp => (
                                                        <div key={exp.id} className="border-l-4 border-orange-500 pl-3 py-2">
                                                            <p className="font-semibold">{exp.productName}</p>
                                                            <p className="text-sm text-gray-600">
                                                                Cantidad retirada: {exp.quantity}
                                                            </p>
                                                            <p className="text-xs text-gray-400">
                                                                {new Date(exp.date).toLocaleString('es-ES')}
                                                            </p>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <p className="text-gray-500 text-center">No hay productos caducados</p>
                                            )}
                                        </div>
                                    )}

                                    {isCoffee && (
                                        <div className="bg-white p-5 rounded-xl shadow">
                                            <h3 className="font-bold mb-4">☕ Stock Actual</h3>
                                            <div className="space-y-2">
                                                {selectedMachine.products.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center py-2 border-b">
                                                        <span className="font-medium">{p.name}</span>
                                                        <span className="font-bold text-amber-600">
                                                            {p.quantity.toFixed(1)} {p.unit}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {showCashModal && <CashModal />}
                        {showCoffeeSalesModal && <CoffeeSalesModal />}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VendingManager />);
    </script>
</body>
</html>
